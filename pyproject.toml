[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitry"
version = "0.1.0"
description = "Mechanistic interpretability, measured against circuits that are known by construction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "mechanistic-interpretability",
  "sparse-autoencoder",
  "activation-patching",
  "circuit-discovery",
  "transformers",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
# The reference implementation the engine's forward pass is measured against.
# Tests that need it skip cleanly when it is absent, which is why CI installs
# it explicitly rather than relying on it being present.
oracle = ["transformers>=4.40", "tokenizers>=0.19"]
plot = ["matplotlib>=3.7"]
data = ["datasets>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: dictionary training and full-model sweeps",
  "oracle: requires transformers for the independent forward-pass cross-check",
  "gpu: requires CUDA; skipped on CPU-only runners",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned rather than left to the default, so that "ruff is clean" means the
# same thing on a contributor's machine, in CI, and in six months' time.  The
# set is deliberately modest: correctness and obvious-bug rules, plus the
# import and comprehension hygiene that keeps diffs small.  Style arguments
# that a reader could reasonably go either way on are left out.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "RUF", "PLE"]
ignore = [
  # Long lines inside docstrings carry derivations and tables that wrap badly;
  # the formatter keeps code within the limit and prose is checked by eye.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests build configs from a shared dict of keyword arguments, which is clearer
# than repeating six fields in every case.
"tests/*" = ["C408"]
